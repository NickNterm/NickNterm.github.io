<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARIS Restaurant</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f9f9f9;
      color: #333;
    }
    header {
      background-color: #222;
      color: #fff;
      padding: 20px;
      text-align: center;
    }
    .menu {
      max-width: 800px;
      margin: 40px auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h2 {
      border-bottom: 2px solid #ddd;
      padding-bottom: 5px;
    }
    .item {
      display: flex;
      justify-content: space-between;
      margin: 8px 0;
    }
    .price {
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>
    <h1>ARIS Restaurant</h1>
    <p>Fine dining with a modern twist</p>
  </header>

  <section class="menu">
    <h2>Starters</h2>
    <div class="item"><span>Bruschetta</span><span class="price">$6</span></div>
    <div class="item"><span>Greek Salad</span><span class="price">$8</span></div>
    <div class="item"><span>Tomato Soup</span><span class="price">$7</span></div>

    <h2>Main Courses</h2>
    <div class="item"><span>Grilled Salmon</span><span class="price">$18</span></div>
    <div class="item"><span>Beef Steak</span><span class="price">$22</span></div>
    <div class="item"><span>Vegetable Risotto</span><span class="price">$15</span></div>

    <h2>Desserts</h2>
    <div class="item"><span>Tiramisu</span><span class="price">$9</span></div>
    <div class="item"><span>Chocolate Cake</span><span class="price">$8</span></div>
    <div class="item"><span>Ice Cream Trio</span><span class="price">$7</span></div>
  </section>
</body>
</html>
